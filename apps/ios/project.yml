name: AITracker
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 153.0.0
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
targets:
  AITracker:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    dependencies:
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: run.aitracker.coach
        INFOPLIST_KEY_CFBundleDisplayName: Run Analytics
        # Exempt encryption declaration; revisit if encryption or distribution changes.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: 'NO'
        DEVELOPMENT_TEAM: DB5JRGGB6A
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Speak with your running coach when you start a voice conversation.
        INFOPLIST_KEY_NSCameraUsageDescription: Run Analytics does not use your camera. Its calling library includes camera support, but coaching uses only your microphone.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIBackgroundModes: audio
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: AITracker.entitlements
        APNS_ENVIRONMENT: production
      configs:
        Debug:
          APNS_ENVIRONMENT: development
  AITrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: AITracker
  AITrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: AITracker
schemes:
  AITracker:
    build:
      targets:
        AITracker: all
    test:
      targets: [AITrackerTests, AITrackerUITests]
