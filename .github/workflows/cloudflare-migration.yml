name: Cloudflare migration safety
on:
  push:
    branches: [codex/cloudflare-coach]
    paths: ['apps/api-cloudflare/**', 'server/**', 'shared/**', 'migrations/**', '.github/workflows/cloudflare-migration.yml']
  pull_request:
    paths: ['apps/api-cloudflare/**', 'server/**', 'shared/**', 'migrations/**', '.github/workflows/cloudflare-migration.yml']
permissions:
  contents: read
jobs:
  staging-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/api-cloudflare/package-lock.json
      - run: npm ci
      - name: Install shared application type dependencies
        working-directory: .
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test Apple notification delivery
        working-directory: .
        run: npx tsx --test scripts/d1/apple-push.test.ts scripts/d1/coach-companion.test.ts scripts/d1/native-reminder-draft.test.ts
      - run: npm run check
      - run: npx tsc --noEmit -p container/tsconfig.json
      - run: npx tsc --noEmit -p container/tsconfig.production.json
      - run: npm test
      - run: npm run build
    # Intentionally no deployment step or production secrets.
