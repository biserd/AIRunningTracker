name: iOS TestFlight upload
on:
  push:
    tags: ['ios-testflight-*']
permissions:
  contents: read
concurrency:
  group: ios-testflight
  cancel-in-progress: false
jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate signing preparation
        run: node --test apps/ios/scripts/prepare-testflight-signing.test.mjs apps/ios/scripts/verify-testflight-build.test.mjs
      - name: Select newest stable Xcode
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
      - name: Generate project and existing artwork
        working-directory: apps/ios
        run: |
          brew install xcodegen
          swift scripts/prepare-icon.swift ../mobile/assets/icon.png Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          xcodegen generate
      - name: Install temporary signing credentials
        env:
          P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN_PATH="$RUNNER_TEMP/aitracker-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/distribution.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security find-certificate -c "Apple Distribution" -p "$KEYCHAIN_PATH" > "$RUNNER_TEMP/distribution-certificate.pem"
          export SIGNING_CERTIFICATE_PATH="$RUNNER_TEMP/distribution-certificate.pem"
          node apps/ios/scripts/prepare-testflight-signing.mjs
      - name: Run simulator tests before signing
        working-directory: apps/ios
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for vs in d["devices"].values() for v in vs if v["name"].startswith("iPhone")))')
          xcodebuild -quiet -project AITracker.xcodeproj -scheme AITracker -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO test
      - name: Archive and export signed app
        working-directory: apps/ios
        run: |
          set -euo pipefail
          xcodebuild -quiet -project AITracker.xcodeproj -scheme AITracker -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/AITracker.xcarchive" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' DEVELOPMENT_TEAM=DB5JRGGB6A RUNANALYTICS_APP_PROFILE="$RUNANALYTICS_APP_PROFILE" RUNANALYTICS_WIDGET_PROFILE="$RUNANALYTICS_WIDGET_PROFILE" archive
          xcodebuild -quiet -exportArchive -archivePath "$RUNNER_TEMP/AITracker.xcarchive" -exportPath "$RUNNER_TEMP/ios-export" -exportOptionsPlist "$RUNNER_TEMP/RunAnalytics-ExportOptions.plist"
      - name: Verify archived encryption declaration
        run: |
          set -euo pipefail
          DECLARATION=$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$RUNNER_TEMP/AITracker.xcarchive/Products/Applications/AITracker.app/Info.plist")
          test "$DECLARATION" = 'false'
      - name: Upload to App Store Connect for TestFlight only
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$API_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8"
          xcrun altool --upload-app --type ios --file "$RUNNER_TEMP/ios-export/AITracker.ipa" --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER"
      - name: Verify Apple processed the uploaded TestFlight build
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: node apps/ios/scripts/verify-testflight-build.mjs
      - name: Remove temporary signing material
        if: always()
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          security delete-keychain "$RUNNER_TEMP/aitracker-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/aitracker.mobileprovision" "$RUNNER_TEMP/profile.plist"
          rm -f "$RUNNER_TEMP/distribution-certificate.pem" "$RUNNER_TEMP/RunAnalytics-ExportOptions.plist"
          rm -f "$RUNNER_TEMP/runanalytics-profiles/app.mobileprovision" "$RUNNER_TEMP/runanalytics-profiles/widget.mobileprovision"
          rmdir "$RUNNER_TEMP/runanalytics-profiles" 2>/dev/null || true
          for PROFILE_UUID in "${RUNANALYTICS_APP_PROFILE:-}" "${RUNANALYTICS_WIDGET_PROFILE:-}"; do
            if [[ "$PROFILE_UUID" =~ ^[0-9A-Fa-f-]{36}$ ]]; then
              rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
            fi
          done
          if [[ "${API_KEY_ID:-}" =~ ^[A-Za-z0-9]+$ ]]; then
            rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8"
          fi
