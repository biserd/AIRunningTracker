name: iOS simulator check
on:
  push:
    branches: [codex/ios-testflight]
    paths: ['apps/ios/**', '.github/workflows/ios-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select newest stable Xcode
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
      - name: Generate project
        working-directory: apps/ios
        run: |
          brew install xcodegen
          swift scripts/prepare-icon.swift ../mobile/assets/icon.png Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          xcodegen generate
      - name: Build and test without signing
        working-directory: apps/ios
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for vs in d["devices"].values() for v in vs if v["name"].startswith("${{ matrix.device }}")))')
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl status_bar "$DEVICE_ID" override --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcodebuild -project AITracker.xcodeproj -scheme AITracker -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO -only-testing:AITrackerUITests/AppStoreCaptureTests test
      - name: Export UI screenshots
        if: always()
        working-directory: apps/ios
        run: |
          RESULT=$(find DerivedData/Logs/Test -name '*.xcresult' -maxdepth 1 | head -1)
          if [ -n "$RESULT" ]; then xcrun xcresulttool export attachments --path "$RESULT" --output-path ui-screenshots; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-insights-${{ matrix.device }}
          path: apps/ios/ui-screenshots
          retention-days: 7
