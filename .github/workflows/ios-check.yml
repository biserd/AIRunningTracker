name: iOS simulator check
on:
  push:
    branches: [codex/ios-testflight]
    paths: ['apps/ios/**', '.github/workflows/ios-check.yml']
  pull_request:
    paths: ['apps/ios/**', '.github/workflows/ios-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select newest stable Xcode
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
      - name: Generate project
        working-directory: apps/ios
        run: |
          brew install xcodegen
          swift scripts/prepare-icon.swift ../mobile/assets/icon.png Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          xcodegen generate
      - name: Build and test without signing
        working-directory: apps/ios
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,re,sys; d=json.load(sys.stdin); runtimes=sorted(d["devices"],key=lambda name:tuple(map(int,re.findall(r"\d+",name))),reverse=True); print(next(v["udid"] for runtime in runtimes for v in d["devices"][runtime] if v["name"].startswith("${{ matrix.device }}")))')
          xcrun simctl list devices available | grep "$DEVICE_ID"
          xcodebuild -project AITracker.xcodeproj -scheme AITracker -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO test
      - name: Verify recording background mode
        working-directory: apps/ios
        run: |
          plutil -extract UIBackgroundModes json -o - DerivedData/Build/Products/Debug-iphonesimulator/AITracker.app/Info.plist | python3 -c 'import json,sys; modes=json.load(sys.stdin); assert "location" in modes and "audio" in modes'
      - name: Verify recording widget is embedded
        working-directory: apps/ios
        run: |
          test -d DerivedData/Build/Products/Debug-iphonesimulator/AITracker.app/PlugIns/RunWidget.appex
          plutil -extract NSSupportsLiveActivities raw DerivedData/Build/Products/Debug-iphonesimulator/AITracker.app/Info.plist
      - name: Export UI screenshots
        if: always()
        working-directory: apps/ios
        run: |
          RESULT=$(find DerivedData/Logs/Test -name '*.xcresult' -maxdepth 1 | head -1)
          if [ -n "$RESULT" ]; then xcrun xcresulttool export attachments --path "$RESULT" --output-path ui-screenshots; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-insights-${{ matrix.device }}
          path: apps/ios/ui-screenshots
          retention-days: 7
