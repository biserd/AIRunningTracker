name: iOS simulator check
on:
  workflow_call:
  push:
    branches: [codex/ios-testflight]
    paths: ['apps/ios/**', '.github/workflows/ios-check.yml']
  pull_request:
    paths: ['apps/ios/**', '.github/workflows/ios-check.yml']
  workflow_dispatch:
    inputs:
      extended_devices:
        description: Also test a compact iPhone and compact iPad
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  ios:
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(inputs.extended_devices && '["iPhone","iPad","Compact iPhone","Compact iPad"]' || '["iPhone","iPad"]') }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select newest stable Xcode
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
      - name: Generate project
        working-directory: apps/ios
        run: |
          brew install xcodegen
          swift scripts/prepare-icon.swift ../mobile/assets/icon.png Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          xcodegen generate
      - name: Build and test without signing
        working-directory: apps/ios
        env:
          SIMULATOR_CLASS: ${{ matrix.device }}
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,os,re,sys
          data=json.load(sys.stdin)["devices"]
          group=os.environ["SIMULATOR_CLASS"]
          family=group.removeprefix("Compact ")
          series=sorted(data,key=lambda name:tuple(map(int,re.findall(r"\d+",name))),reverse=True)
          def size_rank(item):
              name=item["name"]
              if group == "Compact iPhone":
                  if "Pro" in name or "Plus" in name or "Air" in name: return None
                  return 0 if "SE" in name else 1 if re.search(r"\de\b",name) else 2
              if group == "Compact iPad":
                  if "13-inch" in name or "12.9-inch" in name: return None
                  return 0 if "mini" in name else 1 if "11-inch" in name else 2
              return 0
          for runtime in series:
              devices=[(size_rank(i),i) for i in data[runtime] if i["name"].startswith(family)]
              eligible=[pair for pair in devices if pair[0] is not None]
              if eligible:
                  print(min(eligible,key=lambda pair:pair[0])[1]["udid"])
                  break
          else: sys.exit("No simulator found for " + group)')
          xcrun simctl list devices available | grep "$DEVICE_ID"
          xcodebuild -project AITracker.xcodeproj -scheme AITracker -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO test
      - name: Verify recording background mode
        working-directory: apps/ios
        run: |
          plutil -extract UIBackgroundModes json -o - DerivedData/Build/Products/Debug-iphonesimulator/AITracker.app/Info.plist | python3 -c 'import json,sys; modes=json.load(sys.stdin); assert "location" in modes and "audio" in modes'
      - name: Verify recording widget is embedded
        working-directory: apps/ios
        run: |
          test -d DerivedData/Build/Products/Debug-iphonesimulator/AITracker.app/PlugIns/RunWidget.appex
          plutil -extract NSSupportsLiveActivities raw DerivedData/Build/Products/Debug-iphonesimulator/AITracker.app/Info.plist
      - name: Export UI screenshots
        if: always()
        working-directory: apps/ios
        run: |
          RESULT=$(find DerivedData/Logs/Test -name '*.xcresult' -maxdepth 1 | head -1)
          if [ -n "$RESULT" ]; then xcrun xcresulttool export attachments --path "$RESULT" --output-path ui-screenshots; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-insights-${{ matrix.device }}
          path: apps/ios/ui-screenshots
          retention-days: 7
